<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172031">
  <title>Stacker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="board" aria-label="Stacker game board"></canvas>

    <button id="mute" class="icon-btn" type="button" aria-label="Mute sound" title="Sound on/off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>

    <div class="overlay" id="start">
      <div class="panel">
        <h1>Stacker</h1>
        <p>Stop the sliding row and stack it on the one below. Blocks that miss fall away. Reach the <strong>top row</strong> to win the major prize, or the <strong>7th row</strong> for the minor prize.</p>
        <p class="keys">Tap anywhere, click, or press <kbd>Space</kbd> to drop.</p>
        <button class="btn" id="play" type="button">Play</button>
        <p class="best" id="best-start"></p>
      </div>
    </div>

    <div class="overlay" id="result" hidden>
      <div class="panel">
        <h2 id="result-title">Game Over</h2>
        <div class="prize" id="prize" hidden></div>
        <p id="result-text"></p>
        <button class="btn" id="again" type="button">Again</button>
        <p class="best" id="best-result"></p>
      </div>
    </div>

    <div class="overlay" id="paused" hidden>
      <div class="panel">
        <h2>Paused</h2>
        <button class="btn" id="resume" type="button">Resume</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
